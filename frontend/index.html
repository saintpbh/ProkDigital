<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="디지털총회" />
    <meta name="theme-color" content="#1e3f82" />
    <title>한국기독교장로회 디지털 총회</title>
    <script>
      (function() {
        const userAgent = navigator.userAgent.toLowerCase();
        const targetUrl = window.location.href;
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
        const savedPath = localStorage.getItem('pwa_start_path');

        if (isStandalone && window.location.pathname === '/' && savedPath && savedPath !== '/') {
          console.log('[PWA] Early redirect to:', savedPath);
          window.location.replace(savedPath);
          return;
        }

        // In-App Browser Auto-Escape (KakaoTalk, Line, Naver, Instagram, etc.)
        const isKakao = /kakaotalk/i.test(userAgent);
        const isLine = /line/i.test(userAgent);
        const isInstagram = /instagram/i.test(userAgent);
        const isFacebook = /fban|fbav/i.test(userAgent);
        const isNaver = /naver/i.test(userAgent);
        const isDaum = /daum/i.test(userAgent);
        const isInApp = isKakao || isLine || isInstagram || isFacebook || isNaver || isDaum || /inapp|kakaostory|band/i.test(userAgent);
        const isAndroid = /android/i.test(userAgent);

        if (!isStandalone) {
          if (isKakao) {
            // KakaoTalk external browser open scheme (Android & iOS)
            location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(targetUrl);
          } else if (isAndroid && isInApp) {
            // Android Chrome Intent Scheme for other in-app webviews
            location.href = 'intent://' + location.host + location.pathname + location.search + '#Intent;scheme=https;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;package=com.android.chrome;end';
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
